<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MotorTech - Gestión de Taller Automotriz</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav class="navbar">
        <div class="nav-brand">
            <div class="logo-motortech" aria-label="Logo MotorTech">
                <img src="Logo de Taller Automotriz MotorTech.png" alt="Logo Taller Automotriz MotorTech">
            </div>
            <span><strong>MotorTech</strong><small>Taller Automotriz</small></span>
        </div>

        <ul class="nav-links">
            <li><button type="button" class="nav-btn active" data-filter="todos">Taller</button></li>
            <li><button type="button" class="nav-btn" data-filter="reparacion">En Reparación</button></li>
            <li><button type="button" class="nav-btn" data-filter="listos">Listos para Entrega</button></li>
            <li><button class="nav-btn btn-highlight" id="btn-focus-form">+ Nueva Orden</button></li>
            <li>
                <span class="badge-counter" id="contador-ordenes">0 Órdenes</span>
            </li>
        </ul>
    </nav>

    <main class="main-container">
        
        <aside class="form-panel oculto" id="seccion-formulario" aria-hidden="true">
            <div class="form-card">
                <h2><i class="fa-solid fa-clipboard-list"></i> Nueva Orden</h2>
                <form id="form-orden">
                    <div class="form-group">
                        <label for="placa">Placa del Vehículo</label>
                        <input type="text" id="placa" placeholder="Ej: ABC-123" maxlength="7" required disabled>
                    </div>

                    <div class="form-group">
                        <label for="vehiculo_modelo">Vehículo y Modelo</label>
                        <input type="text" id="vehiculo_modelo" placeholder="Ej: Mazda 3 2022" required disabled>
                    </div>

                    <div class="form-group">
                        <label for="falla_reportada">Falla Reportada</label>
                        <textarea id="falla_reportada" rows="4" placeholder="Describe el daño o mantenimiento..." required disabled></textarea>
                    </div>

                    <div class="form-group">
                        <label for="imagen-archivo">Imagen del vehículo</label>
                        <input type="file" id="imagen-archivo" accept="image/jpeg,image/png,image/webp,image/gif" required disabled>
                        <small class="form-help">JPG, PNG, WebP o GIF. Máximo 4 MB.</small>
                        <img id="vista-previa" class="vista-previa" alt="Vista previa del vehículo">
                    </div>

                    <button type="submit" class="btn-submit" disabled>
                        <i class="fa-solid fa-paper-plane"></i> Registrar Orden
                    </button>
                    <button type="button" class="btn-cancelar" id="btn-cancelar" disabled>
                        Cancelar / Volver al Taller
                    </button>
                </form>
        </div>
      </aside>

      <section class="cards-section">
        <div class="section-header">
          <h1 id="titulo-vista">Órdenes en Taller (Todas)</h1>
        </div>

        <div class="cards-grid" id="contenedor-tarjetas"></div>
      </section>
    </main>

    <footer class="footer">
      <p>
        Desarrollo web Full-Stack | Taller Automotriz MotorTech - SENA CBA
        Mosquera
      </p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
